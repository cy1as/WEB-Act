<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | My Little Archive</title>

    <link rel="stylesheet" href="style.css">

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

</head>

<body class="login-page">

    <main class="login-container">

        <div class="login-card">

            <div class="login-symbol">
                ✦
            </div>

            <p class="small-heading">
                MY LITTLE ARCHIVE
            </p>

            <h1>
                Welcome back.
            </h1>

            <p class="login-subtitle">
                There's always another page to write.
            </p>


            <!-- LOGIN FORM -->

            <form id="loginForm" novalidate>

                <div class="input-group-custom">

                    <label for="username">
                        Username
                    </label>

                    <input
                        type="text"
                        id="username"
                        name="username"
                        placeholder="Enter your username">

                </div>


                <div class="input-group-custom">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password">

                </div>


                <div
                    id="loginMessage"
                    class="login-message">
                </div>


                <button
                    type="submit"
                    id="loginButton"
                    class="login-button">

                    Enter My Archive

                </button>

            </form>


            <div class="login-divider">
                <span>or</span>
            </div>


            <p class="account-text">

                Don't have an account?

                <a href="register.html">
                    Create one
                </a>

            </p>


            <div class="default-account">

                <strong>Demo Account</strong>

                <br>

                Username:
                <b>admin</b>

                <br>

                Password:
                <b>12345</b>

            </div>

        </div>

    </main>


    <!-- jQuery -->

    <script
        src="https://code.jquery.com/jquery-3.7.1.min.js">
    </script>


    <!-- jQuery Validation Plugin -->

    <script
        src="https://cdn.jsdelivr.net/npm/jquery-validation@1.19.5/dist/jquery.validate.min.js">
    </script>


    <script>

        // Maximum number of failed attempts

        const MAX_ATTEMPTS = 3;


        // Get previous attempts

        let attempts =
            parseInt(sessionStorage.getItem("loginAttempts")) || 0;


        // Check if already locked

        if (attempts >= MAX_ATTEMPTS) {

            lockLogin();

        }


        // jQuery Validation

        $("#loginForm").validate({

            rules: {

                username: {
                    required: true,
                    minlength: 3
                },

                password: {
                    required: true,
                    minlength: 4
                }

            },


            messages: {

                username: {

                    required: "Please enter your username.",

                    minlength:
                        "Username must be at least 3 characters."

                },

                password: {

                    required: "Please enter your password.",

                    minlength:
                        "Password must be at least 4 characters."

                }

            },


            submitHandler: function(form) {

                loginUser();

            }

        });


        function loginUser() {

            const username =
                $("#username").val().trim();

            const password =
                $("#password").val();


            /*
                Default account
                username: admin
                password: 12345
            */

            let validLogin =
                username === "admin" &&
                password === "12345";


            

            const registeredUser =
                JSON.parse(
                    localStorage.getItem("registeredUser")
                );


            if (
                registeredUser &&
                username === registeredUser.username &&
                password === registeredUser.password
            ) {

                validLogin = true;

            }


            if (validLogin) {

                // Successful login

                sessionStorage.setItem(
                    "loggedIn",
                    "true"
                );

                sessionStorage.setItem(
                    "loggedUsername",
                    username
                );


                // Reset failed attempts

                sessionStorage.removeItem(
                    "loginAttempts"
                );


                $("#loginMessage")
                    .removeClass("error-message")
                    .addClass("success-message")
                    .text(
                        "Login successful! Welcome, " +
                        username + "!"
                    );


                // Redirect

                setTimeout(function() {

                    window.location.href =
                        "landing.html";

                }, 800);


            } else {

                // Wrong credentials

                attempts++;

                sessionStorage.setItem(
                    "loginAttempts",
                    attempts
                );


                const remaining =
                    MAX_ATTEMPTS - attempts;


                if (remaining > 0) {

                    $("#loginMessage")
                        .removeClass("success-message")
                        .addClass("error-message")
                        .text(
                            "Incorrect username or password. " +
                            remaining +
                            " attempt(s) remaining."
                        );

                } else {

                    lockLogin();

                }

            }

        }


        function lockLogin() {

            $("#username").prop(
                "disabled",
                true
            );

            $("#password").prop(
                "disabled",
                true
            );

            $("#loginButton").prop(
                "disabled",
                true
            );


            $("#loginMessage")
                .removeClass("success-message")
                .addClass("error-message")
                .text(
                    "Login locked. You have reached the maximum of 3 failed attempts."
                );

        }

    </script>

</body>

</html>
