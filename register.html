<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register | My Little Archive</title>

    <link rel="stylesheet" href="style.css">

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

</head>

<body class="login-page">

    <main class="login-container">

        <div class="login-card register-card">

            <div class="login-symbol">
                ☾
            </div>

            <p class="small-heading">
                MY LITTLE ARCHIVE
            </p>

            <h1>
                Create your account.
            </h1>

            <p class="login-subtitle">
                Start your own little collection of moments.
            </p>


            <!-- REGISTER FORM -->

            <form id="registerForm" novalidate>


                <div class="input-group-custom">

                    <label for="fullname">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="fullname"
                        name="fullname"
                        placeholder="Your full name">

                </div>


                <div class="input-group-custom">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="you@example.com">

                </div>


                <div class="input-group-custom">

                    <label for="regUsername">
                        Username
                    </label>

                    <input
                        type="text"
                        id="regUsername"
                        name="regUsername"
                        placeholder="Choose a username">

                </div>


                <div class="input-group-custom">

                    <label for="regPassword">
                        Password
                    </label>

                    <input
                        type="password"
                        id="regPassword"
                        name="regPassword"
                        placeholder="Create a password">

                </div>


                <div class="input-group-custom">

                    <label for="confirmPassword">
                        Confirm Password
                    </label>

                    <input
                        type="password"
                        id="confirmPassword"
                        name="confirmPassword"
                        placeholder="Confirm your password">

                </div>


                <div
                    id="registerMessage"
                    class="login-message">
                </div>


                <button
                    type="submit"
                    class="login-button">

                    Create Account

                </button>

            </form>


            <p class="account-text register-bottom">

                Already have an account?

                <a href="login.html">
                    Login here
                </a>

            </p>

        </div>

    </main>


    <!-- jQuery -->

    <script
        src="https://code.jquery.com/jquery-3.7.1.min.js">
    </script>


    <!-- jQuery Validation -->

    <script
        src="https://cdn.jsdelivr.net/npm/jquery-validation@1.19.5/dist/jquery.validate.min.js">
    </script>


    <script>

        $("#registerForm").validate({

            rules: {

                fullname: {

                    required: true,

                    minlength: 2

                },

                email: {

                    required: true,

                    email: true

                },

                regUsername: {

                    required: true,

                    minlength: 3

                },

                regPassword: {

                    required: true,

                    minlength: 4

                },

                confirmPassword: {

                    required: true,

                    equalTo: "#regPassword"

                }

            },


            messages: {

                fullname: {

                    required:
                        "Please enter your full name.",

                    minlength:
                        "Name must be at least 2 characters."

                },

                email: {

                    required:
                        "Please enter your email address.",

                    email:
                        "Please enter a valid email address."

                },

                regUsername: {

                    required:
                        "Please choose a username.",

                    minlength:
                        "Username must be at least 3 characters."

                },

                regPassword: {

                    required:
                        "Please create a password.",

                    minlength:
                        "Password must be at least 4 characters."

                },

                confirmPassword: {

                    required:
                        "Please confirm your password.",

                    equalTo:
                        "Passwords do not match."

                }

            },


            submitHandler: function(form) {

                registerUser();

            }

        });


        function registerUser() {

            const fullname =
                $("#fullname").val().trim();

            const email =
                $("#email").val().trim();

            const username =
                $("#regUsername").val().trim();

            const password =
                $("#regPassword").val();


            // Prevent using the default admin account

            if (username.toLowerCase() === "admin") {

                $("#registerMessage")
                    .removeClass("success-message")
                    .addClass("error-message")
                    .text(
                        "The username 'admin' is reserved. Please choose another username."
                    );

                return;

            }


            // Save registered account

            const user = {

                fullname: fullname,

                email: email,

                username: username,

                password: password

            };


            localStorage.setItem(
                "registeredUser",
                JSON.stringify(user)
            );


            // Success message

            $("#registerMessage")
                .removeClass("error-message")
                .addClass("success-message")
                .text(
                    "Registration successful! Redirecting to login..."
                );


            // Go to login

            setTimeout(function() {

                window.location.href =
                    "login.html";

            }, 1500);

        }

    </script>

</body>

</html>
